<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ModelBatchDown - 模型批量下载器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', -apple-system, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            height: 100vh;
            overflow: hidden;
        }
        .header {
            text-align: center;
            padding: 14px 20px 8px;
            position: relative;
        }
        .header h1 { font-size: 24px; color: #00d4ff; }
        .header p.subtitle { color: #888; font-size: 13px; margin-top: 2px; }
        .lang-selector {
            position: absolute;
            top: 14px;
            right: 20px;
            display: flex;
            gap: 4px;
        }
        .lang-btn {
            padding: 4px 10px;
            border: 1px solid #2a4a6a;
            border-radius: 4px;
            background: #16213e;
            color: #888;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .lang-btn:hover { border-color: #00d4ff; color: #e0e0e0; }
        .lang-btn.active { background: #00d4ff; color: #fff; border-color: #00d4ff; }
        .main-row {
            display: flex;
            gap: 16px;
            padding: 0 20px 16px;
            min-height: calc(100vh - 80px);
            height: auto;
        }
        .left-panel {
            width: 420px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
        }
        .right-panel {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }
        .card {
            background: #16213e;
            border-radius: 10px;
            padding: 18px;
            border: 1px solid #1e3a5f;
            display: flex;
            flex-direction: column;
        }
        .card-title {
            font-size: 15px;
            color: #00d4ff;
            margin-bottom: 12px;
            font-weight: 600;
        }
        label { display: block; font-size: 12.5px; color: #aaa; margin-bottom: 5px; }
        textarea, input, select {
            width: 100%;
            background: #0f1929;
            border: 1px solid #2a4a6a;
            border-radius: 6px;
            color: #e0e0e0;
            padding: 9px 11px;
            font-size: 13.5px;
            outline: none;
            transition: border-color 0.2s;
        }
        textarea:focus, input:focus, select:focus { border-color: #00d4ff; }
        textarea { resize: none; font-family: Consolas, monospace; }
        select { cursor: pointer; appearance: auto; }
        .checkbox-row {
            display: flex; align-items: center; gap: 7px;
            margin-top: 7px; font-size: 12.5px; color: #aaa;
        }
        .checkbox-row input[type="checkbox"] { width: auto; accent-color: #00d4ff; }
        .btn-group { display: flex; gap: 10px; margin-top: 14px; }
        button {
            flex: 1;
            padding: 11px 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-start {
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            color: #fff;
        }
        .btn-start:hover:not(:disabled) { opacity: 0.85; transform: translateY(-1px); }
        .btn-stop {
            background: linear-gradient(135deg, #ff4757, #cc3344);
            color: #fff;
        }
        .btn-stop:hover:not(:disabled) { opacity: 0.85; transform: translateY(-1px); }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-add {
            background: linear-gradient(135deg, #2ed573, #1e90ff);
            color: #fff;
        }
        .btn-add:hover { opacity: 0.85; }
        .btn-clear {
            background: linear-gradient(135deg, #ff6348, #c0392b);
            color: #fff;
        }
        .btn-clear:hover { opacity: 0.85; }
        .btn-remove {
            background: #ff4757;
            color: #fff;
            padding: 4px 8px;
            font-size: 12px;
            flex: 0 0 auto;
        }
        .log-card { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .status-bar {
            display: flex; justify-content: space-between;
            align-items: center; padding: 6px 0 8px;
            font-size: 11.5px; color: #666;
        }
        .status-dot {
            display: inline-block; width: 8px; height: 8px;
            border-radius: 50%; margin-right: 6px;
            background: #666;
        }
        .status-dot.running { background: #2ed573; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
        #log_output {
            background: #0a0f18;
            border: 1px solid #1e3a5f;
            border-radius: 6px;
            color: #7fdbca;
            padding: 14px;
            font-family: Consolas, 'Cascadia Code', 'Fira Code', monospace;
            font-size: 13px;
            line-height: 1.75;
            flex: 1;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .model-list {
            background: #0a0f18;
            border: 1px solid #2a4a6a;
            border-radius: 8px;
            flex: 1;
            overflow-y: auto;
            margin-bottom: 12px;
            padding: 8px;
        }
        .model-item {
            background: #16213e;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 10px;
            border: 1px solid #1e3a5f;
            transition: all 0.2s;
        }
        .model-item:hover {
            border-color: #2a5a7a;
            transform: translateY(-1px);
        }
        .model-item:last-child { margin-bottom: 0; }
        .model-item-header {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 10px;
        }
        .model-item-icon {
            font-size: 20px;
            flex-shrink: 0;
        }
        .model-item-info {
            flex: 1;
            min-width: 0;
        }
        .model-item-name {
            font-size: 14px;
            font-weight: 600;
            color: #e0e0e0;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .model-item-url {
            font-size: 11px;
            color: #666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .model-item-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }
        .model-item-btn {
            background: #2a4a6a;
            color: #ccc;
            border: none;
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .model-item-btn:hover {
            background: #3a5a7a;
        }
        .model-item-btn.remove:hover {
            background: #ff4757;
            color: #fff;
        }
        .model-item-status {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        .model-item-badge {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            background: #2a4a6a;
            color: #aaa;
        }
        .model-item-badge.downloading {
            background: #00d4ff22;
            color: #00d4ff;
        }
        .model-item-badge.paused {
            background: #ffa50222;
            color: #ffa502;
        }
        .model-item-badge.error {
            background: #ff475722;
            color: #ff4757;
        }
        .model-item-badge.success {
            background: #2ed57322;
            color: #2ed573;
        }
        .model-item-progress {
            height: 6px;
            background: #0f1929;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        .model-item-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #0099cc);
            border-radius: 3px;
            transition: width 0.3s;
        }
        .model-item-progress-bar.paused {
            background: linear-gradient(90deg, #ffa502, #ff8800);
        }
        .model-item-progress-bar.error {
            background: linear-gradient(90deg, #ff4757, #cc3344);
        }
        .model-item-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: #888;
        }
        .model-item-size {
            color: #aaa;
        }
        .model-item-speed {
            color: #00d4ff;
            font-weight: 600;
        }
        .model-item-eta {
            color: #666;
        }
        .model-item .remove-btn {
            background: #ff4757;
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 11px;
            cursor: pointer;
            margin-left: 8px;
        }
        .model-item .remove-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .empty-list {
            color: #666;
            text-align: center;
            padding: 30px;
            font-size: 13px;
        }
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-overlay.hidden { display: none; }
        .modal {
            background: #16213e;
            border-radius: 12px;
            padding: 24px;
            width: 480px;
            max-width: 90vw;
            border: 1px solid #2a4a6a;
        }
        .modal h3 {
            color: #00d4ff;
            margin-bottom: 16px;
            font-size: 16px;
        }
        .modal-row {
            margin-bottom: 12px;
        }
        .modal-row label {
            margin-bottom: 6px;
        }
        .modal-btns {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }
        .modal-btns button {
            flex: 1;
        }
        .btn-parse {
            background: #2a4a6a;
            color: #ccc;
        }
        .btn-parse:hover { background: #3a5a7a; }
        .btn-confirm {
            background: linear-gradient(135deg, #2ed573, #1e90ff);
            color: #fff;
        }
        .btn-cancel {
            background: #444;
            color: #ccc;
        }
        .file-select-area {
            margin-top: 12px;
            display: none;
            max-height: 300px;
        }
        .file-select-area.visible { display: block; }
        .file-list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .file-list-header label {
            font-size: 13px;
            color: #00d4ff;
            font-weight: 600;
        }
        .file-list-actions {
            display: flex;
            gap: 6px;
        }
        .btn-select-all {
            padding: 3px 8px;
            font-size: 11px;
            background: #2a4a6a;
            color: #ccc;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-select-all:hover {
            background: #3a5a7a;
            color: #fff;
        }
        .file-list-container {
            max-height: 200px;
            overflow-y: auto;
            background: #0a0f18;
            border: 1px solid #2a4a6a;
            border-radius: 6px;
            padding: 8px;
        }
        .file-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .file-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 8px;
            background: #16213e;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .file-item:hover {
            background: #1e2a4a;
        }
        .file-item input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #00d4ff;
            cursor: pointer;
        }
        .file-item-name {
            flex: 1;
            word-break: break-all;
            color: #e0e0e0;
        }
        .file-item-size {
            color: #888;
            font-size: 11px;
            white-space: nowrap;
        }
        .file-summary {
            margin-top: 8px;
            padding: 8px;
            background: #16213e;
            border-radius: 4px;
            font-size: 12px;
            color: #aaa;
            text-align: center;
        }
        .file-summary span {
            color: #00d4ff;
            font-weight: 600;
        }
        .download-option {
            margin-top: 12px;
            display: none;
        }
        .download-option.visible { display: block; }
        .download-option .option-title {
            font-size: 12.5px;
            color: #aaa;
            margin-bottom: 8px;
        }
        .download-option .option-btns {
            display: flex;
            gap: 10px;
        }
        .download-option .option-btn {
            flex: 1;
            padding: 10px;
            background: #2a4a6a;
            color: #ccc;
            border: 2px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .download-option .option-btn:hover {
            background: #3a5a7a;
        }
        .download-option .option-btn.selected {
            border-color: #00d4ff;
            background: #1e4a6a;
            color: #fff;
        }
        .path-input-wrapper { display: flex; gap: 7px; align-items: stretch; }
        .path-input-wrapper input { flex: 1; }
        .path-input-wrapper button {
            flex: 0 0 auto; padding: 0 14px; font-size: 12.5px;
            background: #2a4a6a; color: #ccc; border-radius: 6px;
        }
        .path-input-wrapper button:hover { background: #3a5a7a; }
        .item-count {
            font-size: 12px;
            color: #888;
            margin-bottom: 8px;
        }
        .parse-status {
            margin-top: 10px;
            padding: 10px;
            background: #0f1929;
            border-radius: 6px;
            font-size: 13px;
            color: #7fdbca;
            display: none;
        }
        .parse-status.visible { display: block; }
        .parse-status.error { color: #ff6348; }

        /* === 微信登录 CSS 已屏蔽（上架微软商店无需登录）===
        .qr-login-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .qr-login-modal.show { display: flex; }
        .qr-login-box {
            background: #16213e;
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            border: 1px solid #1e3a5f;
            min-width: 280px;
        }
        .qr-login-box h3 { color: #00d4ff; margin-bottom: 16px; }
        .qr-code-img {
            width: 200px;
            height: 200px;
            background: #fff;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
        }
        .qr-code-img img { max-width: 100%; max-height: 100%; }
        .qr-status { color: #aaa; font-size: 14px; margin-bottom: 16px; }
        .qr-login-box button {
            background: #ff4757;
            color: #fff;
            border: none;
            padding: 8px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        .qr-login-box button:hover { opacity: 0.85; }
        */

        /* 全局滚动条样式（模型列表 + 日志框） */
        .model-list::-webkit-scrollbar,
        #log_output::-webkit-scrollbar,
        .file-list-container::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }
        .model-list::-webkit-scrollbar-track,
        #log_output::-webkit-scrollbar-track,
        .file-list-container::-webkit-scrollbar-track {
            background: #0a0f18;
            border-radius: 5px;
        }
        .model-list::-webkit-scrollbar-thumb,
        #log_output::-webkit-scrollbar-thumb,
        .file-list-container::-webkit-scrollbar-thumb {
            background: #2a4a6a;
            border-radius: 5px;
            border: 2px solid #0a0f18;
        }
        .model-list::-webkit-scrollbar-thumb:hover,
        #log_output::-webkit-scrollbar-thumb:hover,
        .file-list-container::-webkit-scrollbar-thumb:hover {
            background: #00d4ff;
        }
        /* 始终显示滚动条（即使未溢出也保留轨道） */
        .model-list,
        #log_output,
        .file-list-container {
            scrollbar-width: thin;
            scrollbar-color: #2a4a6a #0a0f18;
        }
        /* 给日志框设个最小/最大高度，确保内容多时滚动 */
        #log_output {
            min-height: 320px;
            max-height: calc(100vh - 220px);
        }
        .model-list {
            min-height: 160px;
            max-height: calc(100vh - 360px);
        }
    </style>
</head>
<body>
<div class="header">
    <h1>🚀 ModelBatchDown</h1>
    <p class="subtitle" id="subtitle">支持 HF / 魔塔双平台 | GGUF量化选择 | 实时日志 | 自动关机</p>
    <div class="lang-selector">
        <button class="lang-btn active" onclick="setLanguage('zh')">中文</button>
        <button class="lang-btn" onclick="setLanguage('en')">EN</button>
    </div>
    <!-- 微信登录状态栏已屏蔽（上架微软商店无需登录）
    <div id="loginStatusBar" style="margin-top:8px;font-size:13px;"></div>
    -->
</div>

<div class="main-row">
    <div class="left-panel">
        <div class="action-bar" style="display:flex;gap:10px;margin-bottom:14px">
            <button class="btn-start" id="btn_start" onclick="startDownload()" style="flex:1;padding:13px 16px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;background:linear-gradient(135deg,#00d4ff,#0099cc);color:#fff" data-i18n="start_download">▶️ 开始下载</button>
            <button class="btn-stop" id="btn_stop" onclick="stopDownload()" style="flex:1;padding:13px 16px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;background:linear-gradient(135deg,#ff4757,#cc3344);color:#fff" disabled data-i18n="stop">⏹️ 停止</button>
        </div>
        <div class="card" style="flex:1">
            <div class="card-title" data-i18n="download_config">📥 模型下载配置</div>

            <div class="item-count"><span data-i18n="added">已添加</span> <span id="item_count">0</span> <span data-i18n="tasks">个下载任务</span></div>

            <div class="model-list" id="model_list">
                <div class="empty-list" id="empty_list_text" data-i18n="no_tasks">暂无下载任务，点击下方「+ 添加模型」按钮添加</div>
            </div>

            <div style="display:flex;gap:10px;margin-bottom:12px">
                <button class="btn-add" id="btn_add_task" onclick="openModal()" style="flex:1" data-i18n="add_model">+ 添加模型</button>
                <button class="btn-clear" id="btn_clear_list" onclick="clearAllTasks()" style="flex:1" data-i18n="clear_list">🗑️ 清空列表</button>
            </div>

            <label data-i18n="save_root">保存根目录</label>
            <div class="path-input-wrapper">
                <input id="save_root" type="text" placeholder="F:\AI_Tools\temp\models">
                <button onclick="chooseFolder()" id="btn_choose_folder" data-i18n="select">📁 选择</button>
            </div>

            <div class="checkbox-row" style="margin-top:14px">
                <input type="checkbox" id="auto_shutdown">
                <label style="margin:0" for="auto_shutdown" data-i18n="auto_shutdown">下载完成后自动关机</label>
            </div>
        </div>
    </div>

    <div class="right-panel">
        <div class="card log-card">
            <div class="status-bar">
                <span><span class="status-dot" id="status_dot"></span><span id="status_text" data-i18n="ready">就绪</span></span>
                <span id="log_count"></span>
            </div>
            <div id="log_output">
            </div>
        </div>
    </div>
</div>

<div class="modal-overlay hidden" id="modal_overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
        <h3 data-i18n="add_task">➕ 添加下载任务</h3>

        <div class="modal-row">
            <label data-i18n="model_url">模型链接</label>
            <input type="text" id="modal_url" placeholder="https://huggingface.co/xxx/model-name&#10;或 https://modelscope.cn/xxx/model-name">
        </div>

        <button class="btn-parse" onclick="parseUrl()" style="width:100%" data-i18n="parse_url">🔍 解析地址</button>

        <div class="parse-status" id="parse_status"></div>

        <div class="file-select-area" id="file_select_area">
            <div class="file-list-header">
                <label data-i18n="select_files">选择要下载的文件</label>
                <div class="file-list-actions">
                    <button type="button" class="btn-select-all" onclick="selectAllFiles(true)" data-i18n="select_all">全选</button>
                    <button type="button" class="btn-select-all" onclick="selectAllFiles(false)" data-i18n="deselect_all">取消</button>
                </div>
            </div>
            <div class="file-list-container" id="file_list_container">
                <div class="file-list" id="file_list"></div>
            </div>
            <div class="file-summary" id="file_summary"></div>
        </div>

        <div class="download-option" id="download_option">
            <div class="option-title" data-i18n="select_mode">选择下载模式：</div>
            <div class="option-btns">
                <button class="option-btn selected" onclick="selectMode('all')" id="mode_all" data-i18n="download_all_btn">
                    📥 <span data-i18n="download_all">全部下载</span><br><small style="opacity:0.7" data-i18n="download_all_desc">下载所有文件</small>
                </button>
                <button class="option-btn" onclick="selectMode('main')" id="mode_main" data-i18n="download_main_btn">
                    ⭐ <span data-i18n="download_main">主要下载</span><br><small style="opacity:0.7" data-i18n="download_main_desc">仅关键运行文件</small>
                </button>
            </div>
        </div>

        <div class="modal-btns">
            <button class="btn-cancel" onclick="closeModal()" data-i18n="cancel">取消</button>
            <button class="btn-confirm" onclick="addToList()" id="btn_add_confirm" disabled data-i18n="confirm_add">✓ 添加</button>
        </div>
    </div>
</div>

let currentLang = localStorage.getItem('lang') || 'zh';

function setLanguage(lang) {
    currentLang = lang;
    localStorage.setItem('lang', lang);
    applyTranslations();
    updateLangButtons();
}

function applyTranslations() {
    document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (translations[currentLang][key]) {
            el.textContent = translations[currentLang][key];
        }
    });
    document.getElementById('subtitle').textContent = translations[currentLang].subtitle;
}

function updateLangButtons() {
    document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.remove('active');
        if (btn.textContent === (currentLang === 'zh' ? '中文' : 'EN')) {
            btn.classList.add('active');
        }
    });
}

let downloadTasks = [];
let currentFiles = [];
let selectedFiles = [];
let selectedQuant = '';
let selectedMode = 'all';
let parsedUrl = '';
let isGgufModel = false;
let currentTaskIndex = 0;
let currentSavePath = '';
const USER_INFO_KEY = 'user_info';
let isLoggedIn = false;
let currentUser = null;

async function checkLoginStatus() {
    try {
        const loggedIn = await invoke('check_login_status');
        isLoggedIn = loggedIn;
        if (loggedIn) {
            currentUser = await invoke('get_user_info');
        }
        updateLoginStatusBar();
    } catch(e) {
        console.error('[App] 检查登录状态失败:', e);
        isLoggedIn = false;
        updateLoginStatusBar();
    }
}

function updateLoginStatusBar() {
    const statusBar = document.getElementById('loginStatusBar');
    if (!statusBar) return;

    if (isLoggedIn && currentUser) {
        const nickname = currentUser.nickname || currentUser.name || currentUser.username || '用户';
        statusBar.innerHTML = `<span style="color:#51cf66;">✅ 已登录: ${nickname}</span> | <a href="#" onclick="handleLogout();return false;" style="color:#ff6b6b;">退出登录</a>`;
    } else {
        statusBar.innerHTML = `<span style="color:#ff6b6b;">❌ 未登录</span> | <a href="#" onclick="handleLogin();return false;" style="color:#00d4ff;">微信登录</a>`;
    }
}

async function handleLogout() {
    try {
        await invoke('logout');
        isLoggedIn = false;
        currentUser = null;
        updateLoginStatusBar();
        appendLog('[INFO] 已退出登录');
    } catch(e) {
        appendLog('❌ 退出登录失败: ' + e);
    }
}

async function loadTasks() {
    try {
        const tasks = await invoke('load_tasks');
        downloadTasks = tasks || [];
        renderTaskList();
    } catch(e) {
        console.error('加载任务失败:', e);
        downloadTasks = [];
        renderTaskList();
    }
}

async function saveTasks() {
    try {
        await invoke('save_tasks', { tasks: downloadTasks });
    } catch(e) {
        console.error('保存任务失败:', e);
    }
}

async function clearAllTasks() {
    if (downloadTasks.length === 0) return;
    if (!confirm(translations[currentLang].clear_confirm)) return;
    downloadTasks = [];
    await saveTasks();
    renderTaskList();
}

function updateTaskProgress(data) {
    // data 包含：file_index, total_files, file_name, downloaded, total, speed, percent
    const taskIndex = data.file_index || 0;
    
    // 更新当前下载任务的进度（每个模型独立显示）
    if (downloadTasks.length > 0) {
        // 更新第一个正在下载的任务
        const task = downloadTasks[0];
        
        // 直接使用后端传来的累计进度
        task.downloaded = data.downloaded || 0;
        task.total = data.total || task.total || 0;
        task.speed = data.speed || '0 B/s';
        task.progress = data.percent || 0;
        task.status = 'downloading';
        
        renderTaskList();
    }
}

function renderTaskList() {
    const list = document.getElementById('model_list');
    const count = document.getElementById('item_count');
    count.textContent = downloadTasks.length;

    if (downloadTasks.length === 0) {
        list.innerHTML = `<div class="empty-list">${translations[currentLang].no_tasks}</div>`;
        return;
    }

    const isRunning = document.getElementById('btn_start').disabled;
    list.innerHTML = downloadTasks.map((task, i) => {
        const fileCount = task.files ? task.files.length : 0;
        const modeText = fileCount > 0 ? `📄 已选 ${fileCount} 个文件` : '📥 全部下载';
        const disabledAttr = isRunning ? 'disabled' : '';
        const statusClass = task.status || 'waiting';
        const progress = task.progress || 0;
        const speed = task.speed || '0 B/s';
        const downloadedSize = task.downloaded || 0;
        const totalSize = task.total || 0;

        let badgeClass = '';
        let badgeText = translations[currentLang].waiting;
        if (statusClass === 'downloading') { badgeClass = 'downloading'; badgeText = translations[currentLang].downloading; }
        else if (statusClass === 'paused') { badgeClass = 'paused'; badgeText = translations[currentLang].paused; }
        else if (statusClass === 'error') { badgeClass = 'error'; badgeText = translations[currentLang].error; }
        else if (statusClass === 'success') { badgeClass = 'success'; badgeText = translations[currentLang].complete; }
        
        const progressBarClass = statusClass === 'paused' ? ' paused' : (statusClass === 'error' ? ' error' : '');
        
        // 格式化已下载和总大小
        const downloadedText = formatBytes(downloadedSize);
        const totalText = formatBytes(totalSize);
        const percentText = progress.toFixed(2) + '%';
        
        return `<div class="model-item" data-index="${i}">
            <div class="model-item-header">
                <div class="model-item-icon">📦</div>
                <div class="model-item-info">
                    <div class="model-item-name">${escapeHtml(task.name || getTaskName(task.url))}</div>
                    <div class="model-item-url">${escapeHtml(task.url)}</div>
                </div>
                <div class="model-item-actions">
                    <button class="model-item-btn" ${disabledAttr} onclick="pauseTask(${i})">⏸️</button>
                    <button class="model-item-btn" ${disabledAttr} onclick="retryTask(${i})">🔄</button>
                    <button class="model-item-btn remove" ${disabledAttr} onclick="removeTask(${i})">✕</button>
                </div>
            </div>
            <div class="model-item-status">
                <span class="model-item-badge ${badgeClass}">${badgeText}</span>
                <span class="model-item-badge">${modeText}</span>
            </div>
            <div class="model-item-progress">
                <div class="model-item-progress-bar${progressBarClass}" style="width: ${progress}%"></div>
            </div>
            <div class="model-item-stats">
                <span class="model-item-size">${downloadedText} / ${totalText}</span>
                <span class="model-item-speed">${speed}</span>
                <span class="model-item-eta">${percentText}</span>
            </div>
        </div>`;
    }).join('');

    // 任务列表变化时调整窗口高度
    adjustWindowHeight();
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function getTaskName(url) {
    try {
        const parts = url.replace(/\/$/, '').split('/');
        if (url.includes('modelscope.cn')) {
            const idx = parts.indexOf('models');
            if (idx >= 0 && parts[idx + 1] && parts[idx + 2]) {
                return parts[idx + 1] + '/' + parts[idx + 2];
            }
        } else if (url.includes('huggingface.co')) {
            const idx = parts.indexOf('huggingface.co');
            if (idx >= 0 && parts[idx + 1] && parts[idx + 2]) {
                return parts[idx + 1] + '/' + parts[idx + 2];
            }
        }
        return parts.slice(-2).join('/') || url;
    } catch(e) {
        return url;
    }
}

function formatBytes(bytes) {
    if (!bytes || bytes === 0) return '0 B';
    const k = 1024;
    const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
}

async function pauseTask(index) {
    // TODO: 实现暂停功能
    appendLog('暂停任务 ' + index);
}

async function retryTask(index) {
    // TODO: 实现重试功能
    appendLog('重试任务 ' + index);
}

async function removeTask(index) {
    downloadTasks.splice(index, 1);
    await saveTasks();
    renderTaskList();
}

function openModal() {
    document.getElementById('modal_overlay').classList.remove('hidden');
    document.getElementById('modal_url').value = '';
    document.getElementById('file_select_area').classList.remove('visible');
    document.getElementById('download_option').classList.remove('visible');
    document.getElementById('parse_status').classList.remove('visible');
    document.getElementById('btn_add_confirm').disabled = true;
    currentFiles = [];
    selectedQuant = '';
    selectedMode = 'all';
    parsedUrl = '';
    isGgufModel = false;
    updateModeButtons();
}

function closeModal() {
    document.getElementById('modal_overlay').classList.add('hidden');
}

function updateModeButtons() {
    document.getElementById('mode_all').classList.toggle('selected', selectedMode === 'all');
    document.getElementById('mode_main').classList.toggle('selected', selectedMode === 'main');
}

function selectMode(mode) {
    selectedMode = mode;
    updateModeButtons();
}

async function parseUrl() {
    const url = document.getElementById('modal_url').value.trim();
    if (!url) return alert(translations[currentLang].no_url);

    parsedUrl = url;
    const fileArea = document.getElementById('file_select_area');
    const optArea = document.getElementById('download_option');
    const statusDiv = document.getElementById('parse_status');

    fileArea.classList.remove('visible');
    optArea.classList.remove('visible');
    statusDiv.classList.remove('visible');
    selectedQuant = '';
    selectedFiles = [];
    currentFiles = [];

    statusDiv.textContent = '正在解析...';
    statusDiv.classList.remove('error');
    statusDiv.classList.add('visible');

    try {
        const result = await invoke('get_model_files', { url });
        currentFiles = result.files || [];

        // 统一显示文件列表复选框
        renderFileList(currentFiles);
        fileArea.classList.add('visible');
        optArea.classList.remove('visible');
        document.getElementById('btn_add_confirm').disabled = false;
    } catch(e) {
        statusDiv.textContent = '❌ 解析失败: ' + e;
        statusDiv.classList.add('error');
    }
}

function formatFileSize(bytes) {
    if (bytes === 0) return '未知大小';
    const units = ['B', 'KB', 'MB', 'GB', 'TB'];
    let unitIndex = 0;
    let size = bytes;
    while (size >= 1024 && unitIndex < units.length - 1) {
        size /= 1024;
        unitIndex++;
    }
    return size.toFixed(2) + ' ' + units[unitIndex];
}

function renderFileList(files) {
    const fileList = document.getElementById('file_list');
    const fileSummary = document.getElementById('file_summary');

    if (!files || files.length === 0) {
        fileList.innerHTML = '<div class="file-item">没有找到文件</div>';
        fileSummary.textContent = '';
        return;
    }

    fileList.innerHTML = files.map((f, index) => `
        <label class="file-item">
            <input type="checkbox" class="file-checkbox" data-index="${index}" checked onchange="updateSelectedFiles()">
            <span class="file-item-name">${f.name}</span>
            <span class="file-item-size">${formatFileSize(f.size)}</span>
        </label>
    `).join('');

    // 默认全选
    selectedFiles = files.map(f => f.name);
    updateSelectedFiles();
}

function updateSelectedFiles() {
    const checkboxes = document.querySelectorAll('.file-checkbox');
    selectedFiles = [];
    checkboxes.forEach((cb, index) => {
        if (cb.checked) {
            selectedFiles.push(currentFiles[index].name);
        }
    });
    const totalSize = selectedFiles.reduce((sum, fname) => {
        const f = currentFiles.find(fi => fi.name === fname);
        return sum + (f ? f.size : 0);
    }, 0);
    const fileSummary = document.getElementById('file_summary');
    fileSummary.innerHTML = `已选择 <span>${selectedFiles.length}</span> / ${currentFiles.length} 个文件，总大小约 <span>${formatFileSize(totalSize)}</span>`;
}

function selectAllFiles(selectAll) {
    const checkboxes = document.querySelectorAll('.file-checkbox');
    checkboxes.forEach(cb => {
        cb.checked = selectAll;
    });
    updateSelectedFiles();
}

async function addToList() {
    if (!parsedUrl) return alert(translations[currentLang].no_parse);
    if (selectedFiles.length === 0) return alert('请至少选择一个文件下载');

    const task = {
        url: parsedUrl,
        files: selectedFiles
    };

    downloadTasks.push(task);
    await saveTasks();
    renderTaskList();
    closeModal();
}

let logBuffer = '';
let logLines = 0;

function appendLog(text) {
    logBuffer += text + '\n';
    logLines++;
    const el = document.getElementById('log_output');
    el.textContent = logBuffer;
    el.scrollTop = el.scrollHeight;
    document.getElementById('log_count').textContent = logLines + ' 条消息';
}

function setStatus(running, text) {
    const dot = document.getElementById('status_dot');
    dot.className = 'status-dot' + (running ? ' running' : '');
    document.getElementById('status_text').textContent = text || (running ? translations[currentLang].downloading : translations[currentLang].ready);
    document.getElementById('btn_start').disabled = running;
    document.getElementById('btn_stop').disabled = !running;
    document.getElementById('btn_add_task').disabled = running;
    document.getElementById('btn_clear_list').disabled = running;
    document.getElementById('btn_choose_folder').disabled = running;
    document.getElementById('save_root').disabled = running;
    document.getElementById('auto_shutdown').disabled = running;
    renderTaskList();
}

async function chooseFolder() {
    try {
        const selected = await window.__TAURI__.dialog.open({ directory: true, multiple: false });
        if (selected) document.getElementById('save_root').value = selected;
    } catch(e) { console.error(e); }
}

async function startDownload() {
    // 微信登录验证已屏蔽（上架微软商店无需登录）

    if (downloadTasks.length === 0) return alert(translations[currentLang].no_tasks_alert);
    const saveRoot = document.getElementById('save_root').value.trim();
    if (!saveRoot) return alert(translations[currentLang].no_save_path);
    const autoShutdown = document.getElementById('auto_shutdown').checked;

    const urls = downloadTasks.map(t => {
        if (t.files && t.files.length > 0) {
            return `${t.url}::FILES:${t.files.join('|||')}`;
        }
        return t.url;
    }).join('\n');

    currentTaskIndex = 0;
    currentSavePath = saveRoot;

    setStatus(true, '正在启动...');
    logBuffer = '';
    logLines = 0;
    document.getElementById('log_output').innerHTML = '';
    document.getElementById('log_count').textContent = '';

    setupListeners();

    try {
        const result = await invoke('start_download', {
            urls, saveRoot, ggufQuant: '', autoShutdown
        });
        appendLog(result);
    } catch(e) {
        appendLog('❌ 错误: ' + e);
        setStatus(false);
    }
}

async function stopDownload() {
    if (!confirm(translations[currentLang].stop_confirm)) return;

    const saveRoot = document.getElementById('save_root').value.trim();
    if (saveRoot && confirm(translations[currentLang].delete_incomplete)) {
        try {
            const result = await invoke('stop_download_with_cleanup', { saveRoot });
            appendLog(result);
        } catch(e) {
            appendLog('❌ 错误: ' + e);
        }
    } else {
        try {
            const result = await invoke('stop_download');
            appendLog(result);
        } catch(e) {
            appendLog('❌ 错误: ' + e);
        }
    }
    cleanupListeners();
    setTimeout(() => setStatus(false), 500);
}

let unlistenLog = null;
let unlistenDone = null;
let unlistenProgress = null;

function setupListeners() {
    if (unlistenLog) return;
    unlistenLog = listen('download-log', (event) => {
        appendLog(event.payload);
    });
    unlistenProgress = listen('download-progress', (event) => {
        updateTaskProgress(event.payload);
    });
    unlistenDone = listen('download-finished', async () => {
        appendLog('\n✅ 所有下载任务完成！');
        downloadTasks = [];
        await saveTasks();
        renderTaskList();
        cleanupListeners();
        setTimeout(() => setStatus(false), 500);
    });
    // 微信登录事件监听已屏蔽
    // unlistenLoginSuccess = listen('login-success', (event) => { ... });
}

function cleanupListeners() {
    if (unlistenLog) { unlistenLog.then(fn => fn()); unlistenLog = null; }
    if (unlistenProgress) { unlistenProgress.then(fn => fn()); unlistenProgress = null; }
    if (unlistenDone) { unlistenDone.then(fn => fn()); unlistenDone = null; }
}

loadTasks();
// checkLoginStatus();  // 微信登录已屏蔽
applyTranslations();
updateLangButtons();

// 窗口自适应：根据内容高度调整窗口
function adjustWindowHeight() {
    const documentHeight = document.documentElement.scrollHeight;
    const minHeight = 700;
    const targetHeight = Math.max(minHeight, documentHeight + 50);
    if (window.__TAURI__) {
        try {
            const currentSize = window.__TAURI__.window.currentMonitor();
            if (currentSize) {
                currentSize.then(monitor => {
                    const maxHeight = monitor.size.height - 100;
                    const newHeight = Math.min(targetHeight, maxHeight);
                    window.__TAURI__.window.getCurrentWindow().setSize({
                        type: 'Logical',
                        width: 1000,
                        height: newHeight
                    });
                }).catch(() => {});
            }
        } catch(e) {}
    }
}

// 页面加载后调整窗口高度
setTimeout(adjustWindowHeight, 500);
