name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Tauri CLI
        working-directory: src-tauri
        run: npm install

      - name: Build Tauri app (Windows)
        working-directory: src-tauri
        run: npm run build

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: ModelBatchDown-win-x64-installer
          path: src-tauri/src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: ModelBatchDown-win-x64-portable
          path: src-tauri/src-tauri/target/release/modelbatchdown.exe
